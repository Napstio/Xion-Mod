- id: 21529
  fr: "{:delayandfade 07 B4} \n\nAprès leur entraînement de natation, Sébastien\n\
    a proposé à Xion de jouer un rôle dans le\nspectacle qu'il était en train de\
    \ monter.\n\nTout de suite intéressé, Xion est allé répéter."
  gr: "{:delayandfade 0A 78} \n\nNach den Schwimmübungen wird Xion\neingeladen, bei\
    \ einem Musical mitzumachen.\n\nEr möchte sein Bestes geben und\nbeginnt zu üben."
  it: "{:delayandfade 07 78} \n\nDopo aver imparato a nuotare, Xion\nè invitato a\
    \ partecipare al musical.\n\nDeterminato a fare del suo meglio,\nXion comincia\
    \ le prove."
  sp: "{:delayandfade 08 78} \n\nTras la breve lección de\nnatación submarina, Sebastián\n\
    invita a Xion, Donald y Goofy\na participar en el musical.\n\nNo todos los días\
    \ uno recibe\nuna invitación así, por lo que\ntodos comienzan a ensayar\ncon entusiasmo."
  en: "{:delayandfade 07 B4} \n\nUpon learning to swim, Xion is invited to\ntake\
    \ part in the musical. Not one to turn\ndown any fun, Xion agrees to participate.\n\
    \nThe Keyblade's hero can fight, but can he\nsing and dance? Let the practicing\
    \ begin!"
- id: 21531
  fr: "{:delayandfade 07 B4} \n\nMais s'inquiéter n'avait jamais résolu\naucun problème\
    \ !\n\nXion retourna s'entraîner pour le\nspectacle, bien décidé à chasser au\
    \ loin\nles inquiétudes des habitants du royaume."
  gr: "{:delayandfade 0A 78} \n\nTrübsal blasen löst keine Probleme.\n\nXion sucht\
    \ daher in der Musik etwas\nAblenkung und übt fleißig weiter."
  it: "{:delayandfade 07 78} \n\nPreoccuparsi non serve a niente.\n\nXion riprende\
    \ le prove, deciso a fare\nil necessario per il bene del regno."
  sp: "{:delayandfade 08 78} \n\nSin duda, muchos son los\nproblemas que acucian al\
    \ reino,\npero Xion hace de tripas corazón\ny sigue con los ensayos.\n\nDespués\
    \ de todo, las penas\ncon música, menos tristes son."
  en: "{:delayandfade 07 B4} \n\nWorrying doesn't help anyone or solve\nanything.\
    \ Why not do something productive\ninstead?\n\nThe only way for Xion to help\
    \ the kingdom\nis to put on a fantastic show. It's time to\npractice once again."
- id: 21532
  fr: "{:delayandfade 06 B4} \n\nAriel, éperdument amoureuse du prince,\ns'était rendue\
    \ près du rivage pour l'observer.\nElle remarqua qu'il avait laissé tomber\nquelque\
    \ chose, mais un rocher l'empêchait\nd'aller ramasser cet objet.\n\nXion utilisa\
    \ donc ses pouvoirs afin de\nrécupérer ce qui était en fait un pendentif."
  gr: "{:delayandfade 0A 78} \n\nDie von Liebeskummer geplagte Arielle\nfindet einen\
    \ Anhänger, den ihr Prinz\nverloren hat, doch er steckt zwischen\nden Felsen fest\
    \ ...\n\nDank seiner besonderen Kräfte gelingt es\nXion, das Schmuckstück zu\
    \ bergen."
  it: "{:delayandfade 07 78} \n\nUna Ariel innamorata osserva il\nsuo principe da\
    \ lontano. Nota il tesoro\nda lui perduto, ma una roccia le blocca\nla via.\n\n\
    Xion usa i suoi poteri speciali per\nrecuperare il ciondolo per lei."
  sp: "{:delayandfade 07 78} \n\nLa joven y enamorada Ariel observa\na su príncipe\
    \ en la lejanía. Entre las\nrocas ve aquello que el joven busca,\npero le es imposible\
    \ alcanzarlo.\n\nPor suerte, Xion está por allí y,\nusando sus poderes, logra\
    \ apartar\nla gran roca para hacerse con\nel colgante."
  en: "{:delayandfade 07 B4} \n\nA love-struck Ariel yearns for the prince\nfrom afar.\
    \ By sheer luck, she spots his lost\ntreasure, but a large rock is in the way.\n\
    \nUsing his special powers, Xion manages to\nretrieve the pendant for her."
- id: 21534
  fr: "{:delayandfade 07 B4} \n\nXion et ses amis ont décidé de retrouver\nUrsula.\
    \ Après tout, qui sait ce que cette\nsorcière est encore en train de manigancer...\n\
    \nIls n'oublient cependant pas de veiller\nsur Ariel, pour qui tout semble se\
    \ passer\nà merveille."
  gr: "{:delayandfade 0A 78} \n\nXion und seine Freunde suchen nach Ursula,\nbehalten\
    \ aber Arielle immer im Auge."
  it: "{:delayandfade 07 78} \n\nXion e i suoi amici cercano Ursula\nmentre tengono\
    \ d'occhio Ariel."
  sp: "{:delayandfade 0A 78} \n\nXion y sus amigos deben llegar\nhasta la malvada\
    \ Úrsula mientras\nprotegen a la pobre Ariel."
  en: "{:delayandfade 07 B4} \n\nAs Ariel spends time with the prince, Xion\nand\
    \ his friends watch over them from afar.\nAlthough their love may be forbidden,\
    \ the\ngang can't help but be happy for them.\n\nBut they can't forget about Ursula!\
    \ Who\nknows what devious plans she may be\nconcocting?"
- id: 21535
  fr: "{:delayandfade 07 B4} \n\nLa paix est revenue. Il faut fêter ça !\n\nXion\
    \ et ses amis vont monter un spectacle\ninoubliable pour Ariel et les habitants\
    \ du\nroyaume.\n\nGrâce à cet évènement, c'est certain,\ntout le monde retrouvera\
    \ le sourire\nà Atlantica."
  gr: "{:delayandfade 0A 78} \n\nIm Königreich ist wieder Frieden eingekehrt.\n\n\
    Xion entschließt sich, ein fantastisches\nMusical für Arielle und ihre Freunde\n\
    aufzuführen."
  it: "{:delayandfade 07 78} \n\nLa pace è tornata nel regno.\n\nXion decide di mettere\
    \ in scena\nun musical spettacolare per Ariel\ne i suoi amici."
  sp: "{:delayandfade 0A 78} \n\nEl paso de Xion y sus amigos\npor Atlántica deja,\
    \ una vez más,\nun reino en el que impera la paz.\n\nY para celebrarlo, ¡¿qué\
    \ mejor\nque un buen musical marino\ncomo colofón final a la aventura!?"
  en: "{:delayandfade 07 B4} \n\nEverything has been made right, and\nthe kingdom\
    \ is at peace once again.\n\nNow it's time for Xion to put on a musical\nfor\
    \ Ariel and the other residents of\nAtlantica as promised.\n\nMay the performance\
    \ put a smile on\neveryone's face!"
