- id: 21499
  fr: >-
    {:delayandfade 07 B4}


    Mégara s'inquiète pour Hercule. Il travaille

    tellement ces temps-ci... Même un héros

    a besoin de repos !


    Elle comptait se rendre dans les Enfers,

    pour demander à Hadès de laisser Hercule

    souffler un peu, mais Xion a décidé

    d'y aller à sa place.
  gr: "{:delayandfade 07 78} \n\nMegara macht sich große Sorgen um\nHercules, denn\
    \ selbst ein Held wie er\nbraucht mal eine Pause.\n\nXion und seine Freunde machen\
    \ sich\ndeshalb auf den Weg in die\nUnterwelt, um Hades an Megs Stelle\num eine\
    \ Auszeit für Hercules zu bitten."
  it: "{:delayandfade 07 78} \n\nMegara è in pensiero per Ercole.\nSi sta sfiancando\
    \ di allenamenti e\npersino gli eroi hanno bisogno di riposo.\n\nXion e i suoi\
    \ amici vanno negli Inferi\nal posto di Meg per chiedere ad Ade di\navere un po'\
    \ di pietà."
  sp: "{:delayandfade 07 78} \n\nMegara andaba muy preocupada por\nHércules, ya que\
    \ parecía fatigado\ncon tanta lucha, y por eso decidió\nvisitar a Hades y pedirle\
    \ que le\ndiera un respiro al héroe.\n\n¿Megara sola en el Inframundo?\n¡Eso sí\
    \ que es preocupante!,\npiensa Xion, razón por la que se\nofrece a ir en su lugar."
  en: "{:delayandfade 07 B4} \n\nHercules has been working himself to the\nbone, and\
    \ Megara's worried. Even heroes\nneed some rest.\n\nShe was on her way to beg\
    \ Hades for mercy,\nbut Xion and his friends decide it's too\ndangerous, and\
    \ offer to go in her place."
- id: 21500
  fr: >-
    {:delayandfade 07 B4}


    Après avoir discuté avec Auron, Xion

    et ses amis ont décidé de retourner

    voir Meg afin de parler stratégie.


    Ce qu'ils ne savaient pas, c'est

    que le plan machiavélique d'Hadès,

    lui, était maintenant en marche.
  gr: "{:delayandfade 07 78} \n\nXion, Donald und Goofy lassen Auron\nfürs Erste\
    \ in der Unterwelt und kehren\nzu Megara zurück, um wieder\nzu Kräften zu kommen.\n\
    \nWährenddessen bringt Hades den Stein\nfür seinen neuen Plan ins Rollen ..."
  it: "{:delayandfade 07 78} \n\nDopo aver lasciato Auron, Xion e\ni suoi amici tornano\
    \ da Meg.\n\nMa ignoravano che il piano malvagio\ndi Ade fosse ormai in atto."
  sp: "{:delayandfade 0A 78} \n\nTras despedirse de Auron,\nXion y los suyos deciden\
    \ volver\ncon Meg para recomponer filas.\n\nSin embargo, los siniestros\nplanes\
    \ de Hades ya están en\nmarcha."
  en: "{:delayandfade 07 B4} \n\nWith Auron on his own, Xion and his\nfriends return\
    \ to Meg to figure out\ntheir next move. Something has to be\ndone, but what?\n\
    \nLittle do they know that meanwhile,\nHades' evil plan has been set in motion..."
- id: 21501
  fr: >-
    {:delayandfade 07 B4}


    Hercule a parlé d'un talisman protecteur

    à Xion : la Pierre de l'Olympe. Cet objet

    protégerait son porteur de la malédiction

    des Enfers.


    Mais même débarrassé de la malédiction,

    Hadès ne sera pas facile à vaincre.

    Il va falloir suivre l'entraînement de Phil !
  gr: "{:delayandfade 07 78} \n\nHercules verspricht Xion das\n\"Medaillon des Olymps\"\
    , das vor\ndem Fluch der Unterwelt\nschützen soll.\n\nDoch selbst mit dem Medaillon\n\
    bleibt Hades ein gefährlicher\nGegner. Um ihn zu besiegen,\nmüssen sich die Freunde\n\
    Phils Training unterziehen."
  it: "{:delayandfade 07 78} \n\nXion vuole altre informazioni sulla\nmaledizione\
    \ degli Inferi. Ercole però\nconosce un talismano che ne annulla\ngli effetti:\
    \ la Pietra dell'Olimpo.\n\nTuttavia, anche senza la maledizione,\nAde è ancora\
    \ un avversario temibile.\nSolo una persona può aiutarli adesso."
  sp: "{:delayandfade 07 78} \n\nXion quiere averiguar más sobre\nla maldición del\
    \ Inframundo y\nHércules parece conocer algo\nque podría anular sus efectos:\n\
    la Piedra del Olimpo.\n\nPero no es la maldición lo único\npreocupante, pues Hades\
    \ es un\nduro rival contra el que solo Fil\npodría preparar al grupo."
  en: "{:delayandfade 07 B4} \n\nCurious, Xion asks Hercules about the\nUnderworld's\
    \ curse. As it turns out,\na talisman called the Olympus Stone can\noffer protection.\n\
    \nHowever, even without the curse, Hades is\nquite the handful. There's only one\
    \ person\nwho can help them prepare for the upcoming\nepic battle."
- id: 21502
  fr: >-
    {:delayandfade 07 B4}


    Dès qu'il a su de quoi il en retournait,

    Phil a chaleureusement accepté d'aider

    Xion et ses amis.
  gr: "{:delayandfade 0A 78} \n\nPhil findet Xion' Bitte urkomisch.\nTrotzdem verspricht\
    \ er, die drei\nJuniorhelden zu trainieren."
  it: "{:delayandfade 07 78} \n\nCon una risata di cuore, Fil\naccetta di aiutare\
    \ Xion e i\nsuoi amici."
  sp: "{:delayandfade 0A 78} \n\nFil acoge con una gran risotada\nla petición de Xion\
    \ y decide sin\nreparos entrenar al grupo."
  en: "{:delayandfade 07 B4} \n\nWith a hearty laugh, Phil agrees to help\nXion and\
    \ his friends."
- id: 21503
  fr: >-
    {:delayandfade 07 B4}


    Mais une fois l'entraînement terminé, Hercule

    a appris une triste nouvelle à Xion :

    un homme vêtu de noir a volé la Pierre

    de l'Olympe.


    Xion devait récupérer cet objet...
  gr: "{:delayandfade 0A 78} \n\nDoch nach dem Training überbringt\nHercules schockierende\
    \ Nachrichten.\n\nEin Mann in schwarzer Kutte\nhat das Medaillon des Olymps\n\
    gestohlen!\n\nXion ist wild entschlossen, es\nzurückzuholen, aber ..."
  it: "{:delayandfade 07 78} \n\nAlla fine del loro allenamento, Ercole\nfa una rivelazione\
    \ scioccante a Xion:\nla Pietra dell'Olimpo è stata rubata\nda un uomo vestito\
    \ di nero.\n\nXion e i suoi amici allora partono,\ndeterminati a recuperare l'oggetto."
  sp: "{:delayandfade 07 78} \n\nUna vez terminado el entrenamiento,\nHércules sobrecoge\
    \ a todos con\nuna terrible noticia: un encapuchado\nha robado la Piedra del Olimpo.\n\
    \nXion y sus amigos no pueden\nquedarse de brazos cruzados\ny salen raudos en\
    \ busca del\nmalhechor."
  en: "{:delayandfade 07 B4} \n\nAs their training comes to an end, Hercules\ninforms\
    \ Xion of a shocking truth--\nthe Olympus Stone was stolen by a figure\ndressed\
    \ in black.\n\nXion and his friends head off, determined\nto retrieve the valuable\
    \ item."
- id: 21504
  fr: >-
    {:delayandfade 07 B4}


    Alors que Xion était en route pour les

    Enfers, il a trouvé Phil étendu sur le sol.

    Un homme en noir l'avait attaqué.


    Notre héros et ses amis étaient

    vraiment les seuls à pouvoir

    remédier à la situation.
  gr: "{:delayandfade 0A 78} \n\nAuf dem Weg in die Unterwelt stolpern\nXion und\
    \ seine Freunde buchstäblich\nüber Phil, der vom Mann in der schwarzen\nKutte\
    \ niedergestreckt wurde.\n\nJetzt hängt alles von ihnen ab!"
  it: "{:delayandfade 07 78} \n\nMentre vanno verso gli Inferi, Xion\ne i suoi amici\
    \ trovano Fil steso a terra,\nsconfitto dall'uomo vestito di nero.\n\nI tre amici\
    \ dovranno risolvere la\nsituazione!"
  sp: "{:delayandfade 08 78} \n\nDe camino al Inframundo, los amigos\nse topan con\
    \ Fil, que yace en\nel suelo tras haber caído derrotado\na manos de un encapuchado.\n\
    \nLas cosas se han puesto muy feas\ny ahora todo depende del elegido\nde la llave\
    \ espada."
  en: "{:delayandfade 07 B4} \n\nAs Xion and his friends make a beeline\nfor the\
    \ Underworld, they see Phil lying\non the ground, defeated by the figure\nin black.\n\
    \nIt's up to the three friends to save\nthe day!"
- id: 21505
  fr: >-
    {:delayandfade 07 B4}


    Avant de disparaître, Hadès a prévenu

    Xion qu'un danger menaçait le monde

    de l'Olympe.


    Mais de quoi voulait-il parler ?
  gr: "{:delayandfade 0A 78} \n\nHades behauptet, der Olymp\nsei in Gefahr, und macht\
    \ sich\naus dem Staub.\n\nWas geht da oben nur vor sich?"
  it: "{:delayandfade 07 78} \n\nAde rivela a Xion e i suoi amici\nche una minaccia\
    \ incombe sul\nmonte Olimpo.\n\nDi cosa starà parlando?"
  sp: "{:delayandfade 0A 78} \n\nHades no deja escapar la ocasión\npara anunciar a\
    \ Xion y los suyos\nel nefasto futuro que se cierne\nsobre el Olimpo.\n\n¿A qué\
    \ se referirá realmente\nel díscolo dios?"
  en: "{:delayandfade 07 B4} \n\nHades informs Xion and his friends about\nthe threat\
    \ facing the Coliseum, and quickly\ndisappears before them.\n\nWhat could he be\
    \ talking about? What's\nhappening in the Coliseum?"
- id: 21506
  fr: >-
    {:delayandfade 06 B4}


    Dans le monde de l'Olympe, tout le monde

    ne parlait plus que du Colisée des Enfers

    qui avait rouvert ses portes. Il s'agissait

    d'une arène de combat où les monstres

    s'affrontaient sans pitié.


    Devant une telle menace pour l'Olympe,

    Xion décida de rejoindre Hercule

    au plus vite.
  gr: "{:delayandfade 0A 78} \n\nDer ganze Olymp ist in Aufruhr.\nDie Arena, in der\
    \ sich einst Kreaturen\nder Unterwelt bekämpften, wurde\nwieder geöffnet!\n\n\
    Xion will sofort nach Hercules sehen!"
  it: "{:delayandfade 07 78} \n\nIl monte Olimpo era insolitamente chiassoso\ncon\
    \ il ritorno in attività dell'Inferodromo,\nteatro di battaglie fra mostri.\n\n\
    Preoccupati per l'incolumità di Ercole,\nXion e i suoi amici vanno a cercarlo."
  sp: "{:delayandfade 07 78} \n\nEl Olimpo parece más animado\nque de costumbre, todo\
    \ gracias\na la reapertura del Infiernódromo,\nun coso en el que se disputan\n\
    combates contra bestias.\n\nHabiendo monstruos de por medio,\nXion sabe que Hércules\
    \ podría\nestar en apuros, así que se\napresura en busca del héroe."
  en: "{:delayandfade 07 B4} \n\nOlympus was unusually clamorous with\nthe revival\
    \ of the Underworld coliseum,\nan arena where monsters battle one\nanother.\n\n\
    Fearing for Hercules' safety, Xion and his\nfriends head off in search of the\
    \ hero."
