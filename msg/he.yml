    so lange,

    bis ich die Hydra besiegt habe!
  it: >-
    Credimi, in questo istante, vorrei


    solo volare a salvare Megara...{:clear }Xion, ti prego, proteggila almeno

    fin quando non avrò sconfitto Idra!
  sp: >-
    Me encantaría ir a rescatar a


    Megara sin perder tiempo...{:clear }¡Por favor, Xion, ayúdala hasta

    que acabe con la Hidra!
  en: >-
    Believe me, I wish I could leave


    this instant to rescue Megara...{:clear }Please help her, Xion, at least

    until I defeat the Hydra!
