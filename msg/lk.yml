- id: 21525
  fr: >-
    {:delayandfade 07 B4}


    Les choses allaient de mal en pis depuis que

    Scar avait pris le pouvoir. Si seulement

    Simba était encore en vie... Mais Scar avait

    été très clair : le lionceau était mort.


    C'était pourtant bien avec Simba que Xion

    avait combattu il y a tout juste un an. Cette

    nouvelle mit Nala de très bonne humeur.

    L'espoir était de nouveau permis sur

    la Terre des Lions.
  gr: "{:delayandfade 0A 78} \n\nNun, da Scar zum König gekrönt wurde,\nist das Königreich\
    \ dem Untergang geweiht.\nAch, wäre nur Simba noch am Leben!\n\nAls Xion erzählt,\
    \ er hätte vor einem Jahr\nmit Simba gekämpft, ist Nala überglücklich.\n\nVielleicht\
    \ besteht doch noch Hoffnung!"
  it: "{:delayandfade 07 78} \n\nOra che Scar è stato incoronato re,\nil regno è finito.\
    \ Nala non può fare a\nmeno d'immaginare come andrebbero\nle cose se Simba fosse\
    \ ancora vivo.\n\nQuando Xion le dice di aver lottato a\nfianco di Simba un anno\
    \ fa, Nala si\nrallegra immensamente.\n\nForse c'è ancora speranza."
  sp: "{:delayandfade 0A 78} \n\nCon Scar como rey y el reino\nen decadencia, Nala\
    \ no puede\nsino pensar cuán distinto sería\ntodo si Simba estuviera vivo.\n\n\
    Por eso, no sale de su asombro\ncuando Xion le cuenta que Simba\nluchó junto\
    \ a él en el pasado.\nQuizá esa noticia sea el rayo de\nesperanza que todos esperaban."
  en: "{:delayandfade 07 B4} \n\nWith Scar as king, the kingdom is doomed.\nIf only\
    \ there were someone else to rule the\nPride Lands. Nala can't help but wonder\
    \ how\ndifferent things would be if Simba were still\nalive.\n\nWhen Xion explains\
    \ that he fought with\nSimba just a year ago, Nala can barely\ncontain her joy.\
    \ Perhaps there's hope\nafter all."
- id: 21528
  fr: >-
    {:delayandfade 07 B4}


    Xion et ses amis étaient partis à la recherche

    de Simba, mais ce dernier demeurait

    introuvable... S'était-il réfugié à l'oasis,

    son endroit préféré ?


    Que pouvait-il bien se passer dans sa tête

    de père et de roi ?
  gr: "{:delayandfade 0A 78} \n\nDoch von Simba fehlt jede Spur. Vielleicht\nist er\
    \ an seinem Lieblingsort, der Oase?\n\nWas geht in ihm vor als Vater, und als\
    \ König?"
  it: "{:delayandfade 07 78} \n\nMa Simba è sparito. Forse si è nascosto\nnel suo\
    \ posto preferito, l'oasi.\n\nOra che è padre e re, che cosa lo\npreoccupa?"
  sp: "{:delayandfade 0A 78} \n\nLa tierra parece haberse tragado\na Simba, pero aún\
    \ queda un sitio\nen el que buscar: el oasis,\nsu lugar favorito.\n\n¿Qué atribulará\
    \ los prensamientos\ndel joven rey y futuro padre\npara hacer que se comporte\
    \ así?"
  en: "{:delayandfade 07 B4} \n\nXion and his friends search for Simba,\nbut he's\
    \ nowhere to be seen. Perhaps he's\nat his favorite spot--the oasis.\n\nStill\
    \ scarred by the memories of the past,\ndoes he have what it takes to be king?"
