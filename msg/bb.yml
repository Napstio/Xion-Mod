- id: 19208
  fr: >-
    L'homme qui s'est enfui dans la cour


    avait l'air féroce. Fais attention à toi.{:clear }Je suis sûr que si tu prends
    toi aussi

    un air féroce tu lui feras peur !
  gr: >-
    Der Mann, der raus in den Vorhof gelaufen


    ist, sah ziemlich gefährlich aus, Xion.{:clear }Meinst du, du kannst das schaffen?

    Na ja, vielleicht musst du ja auch ...{:clear }... einfach nur ganz gemein und
    gefährlich

    dreinschauen, um ihm Angst zu machen.
  it: >-
    L'uomo che è corso in giardino


    sembrava un vero duro, Xion.

    Pensi di farcela?{:clear }Beh, se ti comporti anche tu da

    duro, magari riesci ad intimorirlo!
  sp: >-
    El hombre que ha huido por el jardín parecía


    muy fuerte, Xion. ¿Podrás con él?{:clear }Si te haces el duro,

    quizá no se meta contigo.
  en: >-
    That man who ran out to the garden looked


    pretty tough, Xion. Will you be okay?{:clear }Well, I guess if you acted tough,
    you

    might be able to scare him.
- id: 21494
  fr: "{:delayandfade 06 B4} \n\nD'après Belle, la Bête est étrange\nces derniers\
    \ temps. Elle aurait même\nenfermé les habitants du château\ndans les souterrains.\n\
    \nAlors qu'ils allaient libérer ces derniers,\nXion et ses amis ont rencontré\
    \ une\narmoire. Autrefois humaine, un sortilège\nlui aurait donné son apparence\
    \ actuelle."
  gr: "{:delayandfade 07 78} \n\nLaut Belle verhält das Biest sich sonderbar\nund\
    \ hat sogar die Schlossbewohner\neingesperrt!\n\nXion, Donald und Goofy wollen\
    \ sie retten,\ndoch eine Kommode versperrt ihnen den\nWeg. In Wirklichkeit ist\
    \ diese Kommode\nein verzaubertes Mädchen ..."
  it: "{:delayandfade 07 78} \n\nBelle dice che la Bestia è strana\nultimamente. Ha\
    \ persino chiuso tutti\ngli abitanti del castello nella cripta.\n\nXion e i suoi\
    \ amici vanno nella sala ovest,\ndove trovano un guardaroba davanti\nal passaggio\
    \ per scendere. Scoprono che\nun tempo era un'umana, ma che è stata\ntrasformata\
    \ da un incantesimo."
  sp: "{:delayandfade 07 F0} \n\nBella confiesa que Bestia se porta de forma\nextraña\
    \ últimamente y que ha encerrado\na sus sirvientes en la mazmorra del castillo.\n\
    \nEl grupo se apresura a liberarlos, pero se\ntopa con una sorpresa en su camino...\n\
    ¡un armario parlante que resulta ser una\nseñora bajo el efecto de un vil embrujo!"
  en: "{:delayandfade 07 B4} \n\nAccording to Belle, Beast hasn't been\nhimself lately.\
    \ He's even locked up all the\nresidents of the castle in the undercroft.\n\n\
    Xion and his friends head to the west hall\nto discover a wardrobe blocking the\
    \ door\nleading downstairs. After a brief\nconversation, they learn she used to\
    \ be\nhuman, but was magically transformed\nby an evil spell."
- id: 21495
  fr: >-
    {:delayandfade 07 B4}


    La Bête serait en fait un prince qui vivait

    dans ce château. Il aurait été frappé

    par la même malédiction.


    Les domestiques retenus prisonniers en

    savaient plus à ce sujet.

    Xion s'est précipité dans les souterrains

    pour les retrouver.
  gr: "{:delayandfade 07 78} \n\nSie erzählt, dass das Biest in Wirklichkeit\nder\
    \ Prinz des Schlosses ist und\nebenfalls einmal ein Mensch war.\nDie Bediensteten,\
    \ die im Kerker eingesperrt\nsind, wissen sicher mehr!\n\nXion eilt sofort zum\
    \ Kellergewölbe."
  it: "{:delayandfade 07 78} \n\nDice che un tempo la Bestia era un umano\ne il principe\
    \ del castello. I suoi servitori\nhanno altre informazioni al riguardo.\n\nXion\
    \ scende immediatamente per le scale."
  sp: "{:delayandfade 07 B4} \n\nLa señora cuenta que también Bestia fue en\nsu día\
    \ un humano, el príncipe del castillo.\n\nObtener más respuestas pasa por liberar\n\
    a los pobres sirvientes aún recluidos en\nla mazmorra, por lo que Xion y sus\
    \ amigos\nsiguen adentrándose en el castillo."
  en: "{:delayandfade 07 B4} \n\nShe goes on to explain that Beast was also\nonce\
    \ human, and prince of the castle. If\nXion wants to know more, his servants\n\
    have more details they can share.\n\nCurious to find out the truth, Xion heads\n\
    downstairs."
- id: 21497
  fr: "{:delayandfade 07 B4} \n\nXion et ses amis ont combattu leurs ennemis\net\
    \ protégé Belle. Ils ont sauvé ce qui était\nprécieux aux yeux de la Bête.\n\n\
    C'est du moins ce qu'ils pensaient, jusqu'à\nce que la Bête parte sans Belle.\
    \ Y aurait-il\nquelque chose de plus important pour lui ?"
  gr: "{:delayandfade 0A 78} \n\nXion und seine Gefährten retten Belle.\nSie sind\
    \ erleichtert, dass sie Xaldins\nPlan vereiteln konnten, doch das Biest\nläuft\
    \ davon.\nGibt es etwa etwas, das ihm wichtiger ist\nals Belle?"
  it: "{:delayandfade 07 78} \n\nXion e compagnia sconfiggono i nemici\ne salvano\
    \ Belle. Proteggono \"qualcosa\ndi molto importante per loro\".\n\nO così pensavano,\
    \ fino a quando la Bestia\nse ne va lasciando Belle sola. Cosa\nc'è di più importante\
    \ di Belle per lui?"
  sp: "{:delayandfade 07 B4} \n\nXion y los demás logran derrotar\na sus enemigos\
    \ y proteger a Bella,\naquello tan preciado de lo que habló\nel miembro de la\
    \ Organización {XIII}...\nO eso creen ellos.\n\nSin embargo, Bestia no reacciona\n\
    con alegría, sino que se marcha\ncon gran inquietud... ¿Acaso hay\nalgo aún más\
    \ preciado para él?"
  en: "{:delayandfade 07 B4} \n\nXion and the gang save Belle, managing to\nprotect\
    \ \"something they hold very dear.\"\n\nOr so they thought, until they see Beast\n\
    run off, leaving Belle behind. What could\nbe more important to him than Belle?"
- id: 21498
  fr: "{:delayandfade 07 B4} \n\nLa rose est le seul moyen de lever la\nmalédiction\
    \ jetée sur la Bête et ses\ndomestiques. C'est leur dernier espoir.\n\nPas question\
    \ de baisser les bras !"
  gr: "{:delayandfade 0A 78} \n\nDie Rose ist der Schlüssel zum Aufheben\ndes Fluches\
    \ und die einzige Hoffnung für\ndas Biest und die Schlossbewohner.\n\nDiese Hoffnung\
    \ darf nicht verwelken!"
  it: "{:delayandfade 07 78} \n\nLa rosa è la loro unica speranza di\nspezzare l'incantesimo\
    \ lanciato sulla\nBestia e i suoi amici.\n\nNon possono arrendersi!"
  sp: "{:delayandfade 0A 78} \n\nLa rosa mágica es la clave para\nromper el maléfico\
    \ conjuro que\ntiene embrujados a Bestia y a\ntodos los habitantes del castillo,\n\
    de ahí su preocupación.\n\nSiendo así...\n¡todavía hay esperanzas!"
  en: "{:delayandfade 07 B4} \n\nBeast treasured the rose with his life\nbecause it\
    \ was his only hope of undoing\nthe spell cast upon himself and the others\nin\
    \ the castle.\n\nIt's up to Xion to convince Beast to\nretrieve the precious\
    \ flower for everyone's\nsake."
- id: 21631
  fr: "{:delayandfade 07 B4} \n\nPour les sauver, Xion devait d'abord\nraisonner\
    \ la Bête...\n\nIl a laissé les domestiques le guider\njusqu'à la chambre du maître\
    \ des lieux."
  gr: "{:delayandfade 07 78} \n\nSie verzauberte auch das Schloss und\nalle seine\
    \ Bewohner. Damit sie sich\nzurückverwandeln können, muss zunächst\ndas Biest\
    \ zur Besinnung kommen!\n\nXion, Donald und Goofy folgen den\nBediensteten zu\
    \ seinem Gemach."
  it: "{:delayandfade 07 78} \n\nPer salvare tutti, Xion deve\nprima far tornare\
    \ la Bestia in sé.\n\nGuidato dai servitori del castello,\nil ragazzo va dalla\
    \ Bestia."
  sp: "{:delayandfade 07 C8} \n\nSi los héroes quieren romper\nel hechizo y devolver\
    \ a todos los\nhabitantes del castillo a su forma\noriginal, antes tendrán que\
    \ hacer\nentrar en razón a Bestia.\n\nSiguiendo las indicaciones de\nlos sirvientes,\
    \ Xion y los suyos\nse encaminan al cuarto de Bestia."
  en: "{:delayandfade 07 B4} \n\nIn order to help everyone return to the\nway they\
    \ were, Beast must first come to\nhis senses.\n\nGuided by the castle's servants,\
    \ Xion and\nhis friends head to Beast's chambers.\nThere's no time to lose!"
