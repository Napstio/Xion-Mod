- id: 22032
  fr: >
    ⤷ La Taupe peut aider {:color #FFEC1980}une fois{:reset} Xion à éviter un obstacle.
  gr: >
    ⤷ Gopher wird Xion {:color #FFEC1980}einmal{:reset} bei einem Hindernis helfen!
  it: >
    ⤷ De Castor può salvare Xion da un ostacolo {:color #FFEC1980}una sola volta{:reset}!
  sp: >
    ⤷ ¡Topo ayudará a Xion {:color #FFEC1980}una vez{:reset} con un obstáculo!
  en: >
    ⤷ Gopher will help Xion with an obstacle {:color #FFEC1980}one time{:reset}!
- id: 22033
  fr: >-
    Après avoir heurté un obstacle,


    appuie sur {:icon dynamic-triangle} pour récupérer Winnie

    {:color #FFEC1980}Winnie doit être avec Xion pour ramasser le miel{:reset}.
  gr: >-
    Drücke {:icon dynamic-triangle} nach einem Zusammenstoß,


    oder Puuh verliert weitere Versuche.

    Um {:color #FFEC1980}Kugeln aufzusammeln{:reset}, muss Puuh bei Xion sein.
  it: >-
    Premi {:icon dynamic-triangle} dopo aver urtato contro un


    ostacolo o Pooh continuerà a perdere energia.

    {:color #FFEC1980}Pooh deve essere con Xion a raccogliere le sfere{:reset}.
  sp: >-
    Si chocas con un obstáculo, pulsa {:icon dynamic-triangle}


    o Pooh continuará perdiendo vitalidad.

    {:color #FFEC1980}Pooh debe estar con Xion para poder

    recoger esferas{:reset}.
  en: >-
    Press {:icon dynamic-triangle} after hitting an obstacle


    or Pooh will continue to lose health.

    {:color #FFEC1980}Pooh must be with Xion to collect Orbs{:reset}.
- id: 22035
  fr: >
    ⤷ La Taupe peut aider {:color #FFEC1980}une fois{:reset} Xion à éviter un obstacle.
  gr: >
    ⤷ Gopher wird Xion {:color #FFEC1980}einmal{:reset} bei einem Hindernis helfen!
  it: >
    ⤷ De Castor può salvare Xion da un ostacolo {:color #FFEC1980}una sola volta{:reset}!
  sp: >
    ⤷ ¡Topo ayudará a Xion {:color #FFEC1980}una vez{:reset} con un obstáculo!
  en: >
    ⤷ Gopher will help Xion with an obstacle one time!
- id: 22039
  fr: >-
    ⤷ Tu perds un essai lorsque Xion retombe sur le trampoline.

        La partie s'arrête au bout de {:color #FFEC1980}trois essais{:reset}.
  gr: >-
    ⤷ Wann immer Xion aus dem Rhythmus kommt und wieder {:color #FFEC1980}auf

        dem Trampolin aufkommt{:reset}, verliert er einen Versuch.
  it: "⤷ Xion perde un tentativo quando ricade sul trampolino. Il gioco \n\n    finisce\
    \ quando Xion {:color #FFEC1980}esaurisce i tentativi a sua disposizione{:reset}."
  sp: >-
    ⤷ Si Xion cae, perderá un intento.

        El juego termina si {:color #FFEC1980}se queda sin intentos{:reset}.
  en: >-
    ⤷ Whenever Xion falls from a balloon to the

        trampoline, the player loses one of their tries.
        The game is over when {:color #FFEC1980}zero tries are left{:reset}.
