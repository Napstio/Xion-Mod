- id: 21474
  fr: "{:delayandfade 06 B4} \n\nXion était un jeune garçon qui passait\nses journées\
    \ à s'amuser avec ses amis\ntout en profitant du doux parfum de la mer,\njusqu'au\
    \ jour où une porte vers d'autres\nmondes s'ouvrit.\n\nSa maison et son île tout\
    \ entière furent\nenglouties par les ténèbres, et il perdit\nmême une jeune fille\
    \ à qui il tenait tout\nparticulièrement."
  gr: "{:delayandfade 0A 78} \n\nDer salzige Geruch des Meeres in der Luft.\nRumalbern\
    \ bis zum Sonnenuntergang.\nEin ganz normaler Tag für Xion.\nDoch plötzlich öffnet\
    \ sich die Tür in eine andere\nWelt und alles verschwindet in der Dunkelheit.\n\
    \nSogar sie, die ihm am wichtigsten war ..."
  it: "{:delayandfade 07 78} \n\nLa spiaggia era dove giocava sempre un\nragazzino\
    \ di nome Xion. In compagnia\ndei suoi amici, giocava fino al tramonto.\n\nMa\
    \ un giorno apparve una porta per\nun altro reame, e la sua casa, l'isola e\n\
    tutto ciò che conosceva furono\nrisucchiati nell'oscurità.\n\nIncluso il suo migliore\
    \ amico."
  sp: "{:delayandfade 0A 78} \n\nEl mar trae aromas familiares y evoca\nlas imágenes\
    \ de una playa en la que\nun joven llamado Xion solía jugar\njunto a sus amigos\
    \ hasta el atardecer.\n\nEntonces, se abre una puerta a otro\nmundo y su hogar,\
    \ las islas... todo\nes engullido por la oscuridad.\n\nTodo. Incluso su mejor\
    \ amiga..."
  en: "{:delayandfade 07 B4} \n\nThe beach was the playground of a young boy named\
    \ Xion.\nOn the sandy shores, he and his friends would laugh and play\nuntil\
    \ the sun disappeared from the sky.\n\nBut one day, the door to another realm\
    \ appeared,\nsucking into the darkness his home, the island,\nand everything he\
    \ knew.\n\n...Including his best friend."
- id: 21477
  fr: "{:delayandfade 07 B4} \n\nRoxas a trouvé un message d'Hayner\nau repaire :\n\
    \n\"Rendez-vous à la gare.\nLa plage nous attend.\"\n\nIl s'est tout de suite\
    \ mis en route."
  gr: "{:delayandfade 0A 78} \n\nZurück in ihrem Treff findet Roxas\neine Nachricht\
    \ von Hayner:\n\"Heute geht's ab ans Meer!\"\nRoxas eilt zum Bahnhof,\num seine\
    \ Freunde zu treffen."
  it: "{:delayandfade 07 78} \n\nAl suo arrivo al solito ritrovo del gruppo,\nRoxas\
    \ trova un biglietto di Hayner.\n\n\"Incontriamoci alla stazione.\nOggi andremo\
    \ in spiaggia.\"\n\nTutto contento, si dirige verso la stazione."
  sp: "{:delayandfade 08 78} \n\nAl llegar al lugar de siempre,\nRoxas encuentra una\
    \ nota\nde Hayner que dice:\n\"Nos vemos en la estación.\n¡Hoy nos vamos a la\
    \ playa!\nLa pasta no es problema\".\n\nTras leerla, Roxas se marcha\ncamino de\
    \ la estación."
  en: "{:delayandfade 07 B4} \n\nWhen Roxas arrives at the gang's usual\nspot, he spots\
    \ a note from Hayner.\n\n\"Meet at the station. Today's the day we\nhit the beach!\"\
    \n\nHe heads for the station, excited at the\nprospect of a fun day with his friends."
- id: 21479
  fr: "{:delayandfade 06 B4} \n\nLe groupe d'amis a décidé d'enquêter à\npropos des\
    \ rumeurs dont Pence leur a\nparlé. Leur devoir concernera donc\nles sept mystères\
    \ de la Cité du Crépuscule.\n\nHayner et Olette chercheront de nouvelles\nrumeurs\
    \ en ville, tandis que Roxas et Pence\nprendront le train pour enquêter sur chacun\n\
    des mystères."
  gr: "{:delayandfade 07 78} \n\nPence hat eine Idee für den Aufsatz:\n\"Die Sieben\
    \ Wunder von Twilight Town\".\n\nHayner und Olette hören sich in der Stadt\nnach\
    \ weiteren Gerüchten um, während\nRoxas und Pence den Zug nehmen,\num die Wahrheit\
    \ über die Geschichten\nherauszufinden."
  it: "{:delayandfade 07 78} \n\nCome argomento dei loro compiti estivi,\ni ragazzi\
    \ decidono di investigare le\nleggendarie sette meraviglie di Crepuscopoli.\n\n\
    Hayner e Olette vanno in città mentre\nRoxas e Pence prendono il treno per\nscoprire\
    \ la verità riguardo le storie\ndella città."
  sp: "{:delayandfade 07 78} \n\nLa idea de Pence sobre los rumores\nparece buena\
    \ y todos deciden\ninvestigar sobre las Siete Maravillas\npara su redacción de\
    \ verano.\n\nHayner y Olette se marchan a la\nciudad en busca de más rumores,\n\
    mientras que Roxas y Pence se\ndisponen a comprobar qué hay\nde verdad en ellos."
  en: "{:delayandfade 07 B4} \n\nThe gang decides to investigate the\nmysterious rumors\
    \ floating around\ntown--the seven wonders of Twilight\nTown--for their independent\
    \ studies\nhomework.\n\nHayner and Olette head into town for\nnew information\
    \ while Roxas and Pence\nhop on the train in hopes of uncovering\nthe truth behind\
    \ the rumors."
- id: 21480
  fr: "{:delayandfade 07 B4} \n\nRoxas et ses amis ont enquêté sur de\nnombreux mystères,\
    \ mais ce qu'ils ont\ndécouvert les a relativement déçus...\n\nAprès tout, qui\
    \ avait-il de mystérieux\ndans un chien ou dans son propre reflet ?"
  gr: "{:delayandfade 0A 78} \n\nWeder das Gerücht vom lebenden Sack\nnoch das vom\
    \ Doppelgänger ist wahr.\nRoxas und seine Freunde gehen\nallen Gerüchten nach,\
    \ doch die Wahrheit\nist stets alles andere als aufregend."
  it: "{:delayandfade 07 78} \n\nRoxas e i suoi amici investigano le voci\nuna per\
    \ una, ma le loro scoperte sono\ntutte una delusione."
  sp: "{:delayandfade 0A 78} \n\nRoxas y sus amigos comprueban\nlas Siete Maravillas\
    \ una a una,\npero ni una de ellas parece tener\nrealmente nada de maravilloso."
  en: "{:delayandfade 07 B4} \n\nRoxas and his friends investigate the\nrumors one\
    \ by one, but their findings all\nprove to be disappointing. A dog? Their\nown\
    \ reflection?\n\nThe truths behind the wonders are\nanything but wonderful."
- id: 21629
  fr: "{:delayandfade 07 B4} \n\nAprès avoir sauvé le cæur de Naminé, Xion s'est\n\
    jeté dans une dernière bataille, encouragé par\nles promesses que son amie et\
    \ lui s'étaient\nfaites par le passé...\n\n«Peu importe où nous sommes, nos cæurs\n\
    nous réuniront à nouveau.»\n\n« N'oublie jamais. Où que tu ailles, je serai\n\
    toujours à tes côtés. »"
  gr: "{:delayandfade 0A 78} \n\nXion rettet Kairis Herz.\n\n\"Solange unsere Herzen\
    \ verbunden sind,\nwerden wir uns wiedersehen!\"\n\"Vergiss nicht, dass ich immer\
    \ bei dir bin!\"\nMit diesem Versprechen in sich stürzt\nXion sich in seinen\
    \ letzten Kampf."
  it: "{:delayandfade 07 78} \n\nDopo aver salvato il cuore di Naminé, Xion\naffronta\
    \ un'ultima battaglia. Trova forza\nnelle promesse che si sono fatti l'un\nl'altra\
    \ tanto tempo fa.\n\n\"Non importa dove saremo,\ni nostri cuori ci riuniranno.\"\
    \n\n\"Non dimenticarlo mai. Ovunque tu\nvada, io sarò sempre con te.\""
  sp: "{:delayandfade 0A 78} \n\nTras rescatar el corazón de Naminé, Xion\nse encamina\
    \ a la batalla definitiva.\n\n\"Estemos donde estemos, nuestros\ncorazones volverán\
    \ a reunirnos.\"\n\n\"No lo olvides. Siempre estoy contigo.\"\n\nAquellas promesas\
    \ resuenan ahora\nmás fuerte si cabe en sus corazones."
  en: "{:delayandfade 07 B4} \n\nAfter rescuing Naminé's heart, Xion faces one last\
    \ battle.\n\nHe finds strength in the promises they made to\neach other long ago.\n\
    \n\"No matter where we are, our hearts will bring us\ntogether again.\"\n\n\"\
    Don't forget. Wherever you go, I'm always with you.\""
- id: 21630
  fr: "{:delayandfade 07 B4} \n\nXion avait été séparé de son amie, mais\nil savait\
    \ qu'ils se retrouveraient. Son voyage ne\ns'achèverait pas tant qu'ils ne seraient\
    \ pas\ntous rentrés chez eux.\n\nLeur histoire ne faisait que commencer..."
  gr: "{:delayandfade 0A 78} \n\nXion glaubt fest an ein Wiedersehen.\nIrgendwann\
    \ werden sie alle wieder zusammen\nsein. Doch bis sie gemeinsam zu Hause\nsind,\
    \ geht die Reise weiter.\n\nUnd so nimmt die Geschichte ihren Lauf ..."
  it: "{:delayandfade 07 78} \n\nXion Saluta i suoi amici nella speranza\ndi rivederli.\
    \ Anche se sono separati, si\nreincontreranno. Dopo tutto, il loro\nviaggio sarà\
    \ concluso solo quando\ntorneranno tutti a casa.\n\nE così comincia una nuova\
    \ storia..."
  sp: "{:delayandfade 0A 78} \n\nXion deja a su amigo con la esperanza\nde que volverán\
    \ a reunirse por muy\nlejos que acaben el uno del otro.\n\nEl viaje será largo\
    \ y duro, pero no\nllegará a su fin hasta que todos estén\nde vuelta en su hogar.\n\
    \nY así, comienza la aventura..."
  en: "{:delayandfade 07 B4} \n\nXion says good-bye to his friend in hopes of reuniting\
    \ with\nher again. But he's not alone; they're together in spirit,\nafter all.\n\
    \nOnly when they all return to their hometown will their journey end.\n\nAnd so,\
    \ the story continues..."
