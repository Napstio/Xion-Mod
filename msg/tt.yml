    nos questions. J'en suis certain.{:delay 1D 01}{:clear }Parce qu'il est moi.
  gr: >
    Xion wird die Antwort finden, die wir suchen.{:delay A0 00}{:clear } {:delay
    7E 00}{:clear }Ich weiß es genau. Weil er ich ist.
  it: >-
    Xion troverà la risposta che cerchiamo.


    Ne sono certo.{:delay 1D 01}{:clear }Perché lui è me.
  sp: >-
    Xion dará con las respuestas que buscamos.


    Sé que lo hará... {:delay 1D 01}{:clear }Somos la misma persona.
  en: >-
    Xion will find the answer we're


    looking for. I know he will.{:delay 1D 01}{:clear }Because he's me.
