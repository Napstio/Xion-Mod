    Tu, io, lei...{:delay 40 01}{:clear }O sto solo sognando a occhi aperti?
  sp: >-
    He estado pensando sobre algo


    que dijo Kairi.{:delay 0E 01}{:clear } {:delay 32 00}{:clear }Roxas... ¿estás seguro
    de que realmente

    no tienes corazón?{:delay 68 01}{:clear }¿Y si todos nosotros tuviéramos uno?

    Ella, tú, yo... Todos. {:delay 40 01}{:clear }Quizá no sean más que ilusiones
    mías.
  en: >-
    You know, I've been thinking about


    something Kairi said.{:delay 0E 01}{:clear } {:delay 32 00}{:clear }Roxas, are
    you really sure that

    you don't have a heart?{:delay 68 01}{:clear }Is it possible that we ALL have
    one?

    You, me, her...{:delay 40 01}{:clear }Or is that just wishful thinking?
- id: 19920
  fr: >-
