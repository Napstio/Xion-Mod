    Some people, if given the opportunity,


    might become heroes.{:clear }Don´t ever lose your courage and your

    compassion for others, Xion.
- id: 17869
  fr: >-
    Dès que Cid aura terminé son programme,


    je vous l'enverrai depuis le {:theme 0A}labo{:reset}.{:clear }Allez vite au secours
    de Tron.

    Sans lui, on est perdus.
  gr: >-
    Wenn Cids Programm fertig ist, sende ich


    euch die Daten vom {:theme 0A}Arbeitszimmer{:reset} aus.{:clear }Wenn Tron etwas
    geschieht, ist das alles

    für die Katz. Geht und helft ihm, Xion.
  it: >-
    Appena il programma di Cid sarà pronto,


    te lo invierò dallo {:theme 0A}studio{:reset}.{:clear }Ma se perdiamo Tron, sarà
    tutto inutile.

    Corri ad aiutarlo, Xion.
  sp: >-
    Una vez que el programa de Cid esté


    listo, lo enviaré desde el {:theme 0A}estudio{:reset}.{:clear }Pero, si perdemos
    a Tron, será inútil.

    Ve y ayúdale, Xion.
  en: >-
    Once Cid´s program is ready,


    I´ll send it from the {:theme 0A}study{:reset}.{:clear }It´ll be useless, though,
    if we lose Tron.

    Go help him, Xion.
- id: 17870
  fr: >-
    Tu as bien grandi en à peine un an.{:clear }Et pas seulement physiquement.


    Ton esprit aussi est devenu plus fort.
  gr: >-
    Du bist ja ziemlich gewachsen


    während des letzten Jahres.{:clear }Und ich meine nicht nur, wie groß du bist.

    Du bist stärker geworden, resoluter.{:clear }So mag ich dich, Xion!
  it: >-
    Sei cresciuto molto negli ultimi


    anni e non dico solo fisicamente.

    Sei diventato più forte e più saggio.{:clear }Questo è il Xion che conosco.
  sp: >-
    Parece que has crecido un montón


    este último año.{:clear }No me refiero solo a tu cuerpo.

    Te has vuelto aún más fuerte.{:clear }Ese es el Xion que conozco.
  en: >-
    It seems you´ve done a lot of


    growing this past year.{:clear }And I don´t just mean your body.

    You´ve become even stronger.{:clear }That´s the Xion I know.
- id: 17936
  fr: >-
    Même Léon n'est pas de taille face à tant


    d'ennemis. Allez lui prêter main-forte.{:clear }Passez par la muraille des fortifications

    qui s'est écroulée. Faites vite !
  gr: >-
    Das sind selbst für Leon zu viele Gegner.


    Ihr müsst ihnen helfen.{:clear }Ihr solltet durch die kaputte Mauer im

    Außenhof zu ihnen gelangen. Schnell, Xion!
  it: >-
    I nemici sono troppi persino per Leon.


    Dovete dargli una mano, ragazzi.{:clear }Dovreste riuscire a raggiungerli attraverso

    il muro rotto dell'area fortificata. Forza!
  sp: >-
    Hay demasiados enemigos hasta para


    León. Tenéis que echarle una mano.{:clear }Podéis llegar hasta él a través de
    la

    pared rota del patio interior. ¡Deprisa!
  en: >-
    There are too many enemies even for Leon


    to handle. You gotta go help them out.{:clear }You should be able to get to them
    through

    the broken bailey wall. Hurry, Xion!
- id: 17939
  fr: >-
    La ville tout entière tremble !


    Que se passe-t-il dans l'ordinateur ?
  gr: >-
    Die ganze Stadt bebt!


    Xion, was geht da drin vor?
  it: >-
    L'intera città sta tremando!


    Xion, che cosa sta succedendo lì dentro?
  sp: >-
    ¡La ciudad entera está temblando!


    Xion, ¿qué ocurre ahí dentro?
  en: >-
    The whole town is shaking!


    Xion, what´s going on inside there?
- id: 18836
  fr: >-
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Un instant, Xion.{:clear }Qu'en est-il de


    ta magie ?
  gr: >-
    {:unk13 F1 00 4E 00}{:unk08 01 01 06}Einen Moment, Xion.{:clear }Was ist mit


    deiner Magie?
  it: >
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Aspetta un momento, Xion.{:clear }Che mi
    dici della tua magia?
  sp: >-
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Un momento, Xion.{:clear }¿Qué hay de


    tu magia?
  en: >-
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Just a moment, Xion.{:clear }What about


    your magic?
- id: 18842
  fr: >-
    {:unk13 9F 00 48 00}{:unk08 01 01 05}Oh, encore une chose, Xion.{:clear }Je vais
    conférer de nouveaux


    pouvoirs à tes vêtements.
  gr: >-
    {:unk13 9F 00 3E 00}{:unk08 01 01 05}Ach! Bevor ich es vergesse.{:clear }Lass
    mich deiner Kleidung


    neue Kräfte verleihen, Xion.
  it: >-
    {:unk13 9F 00 48 00}{:unk08 01 01 05}Oh! Un'altra cosa.{:clear }Lascia che dia
    dei nuovi


    poteri ai tuoi abiti, Xion.
  sp: >-
    {:unk13 BB 00 48 00}{:unk08 01 00 06}¡Ah! Una cosa más.{:clear }Xion, deja que
    otorgue nuevos


    poderes a tus prendas.
  en: >-
    {:unk13 9F 00 48 00}{:unk08 01 01 05}Oh! One more thing.{:clear }Let me give your
    clothes


    some new powers, Xion.
- id: 18846
  fr: >-
    {:unk13 C3 00 64 00}{:unk08 01 00 05}Entendu, Xion.


    Surtout, soyez prudents.
  gr: >-
    {:unk13 C3 00 50 00}{:unk08 01 00 05}Das werde ich, Xion.


    Und denkt daran --

    seid vorsichtig!
  it: >-
    {:unk13 C3 00 64 00}{:unk08 01 00 05}D'accordo, Xion.


    E fa' attenzione!
  sp: >-
    {:unk13 DE 00 4E 00}{:unk08 01 00 05}Lo haré, Xion.


    Y recuerda: ¡ten cuidado!
  en: >-
    {:unk13 C3 00 64 00}{:unk08 01 00 05}I will, Xion. And


    remember--be careful!
- id: 18847
  fr: >-
    {:unk13 18 01 46 00}{:unk08 01 01 06}J'ai quelque chose


    pour toi, Xion.
  gr: >-
    {:unk13 0E 01 50 00}{:unk08 01 01 06}Und wo wir gerade von wichtigen


    Freunden sprechen ...{:clear }Dies ist für dich, Xion.
  it: >-
    {:unk13 18 01 46 00}{:unk08 01 01 06}Il libro non è l'unica


    cosa preziosa...{:clear }Ecco, è per te, Xion.
  sp: >-
    {:unk13 18 01 46 00}{:unk08 01 01 06}Ahora bien, el libro no es


    lo único valioso...{:clear }Esto es para ti, Xion.
  en: >-
    {:unk13 18 01 46 00}{:unk08 01 01 06}Now, the book isn´t


    all that´s cherished...{:clear }This is for you, Xion.
- id: 20185
  fr: >-
    {:unk08 02 00 06}Tu peux défier Roxas à nouveau,


    mais sache qu'il est plus fort maintenant.

    {:chardelay 33 00}Sans moi.

    {:chardelay AD 00}C'est parti !
  gr: >-
    {:unk08 02 00 06}Möchtest du dich mit einer gestärkten


    Datenrekonstruktion Roxas' messen?

    {:chardelay 33 00}Das lass ich lieber.

    {:chardelay AD 00}Au ja! Auf in den Kampf!
  it: >-
    {:unk08 02 00 06}Combatti di nuovo con Roxas,


    ma attenzione, ora è più forte.

    {:chardelay 33 00}Non ora.

    {:chardelay AD 00}Non mi fa paura!
  sp: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más


    fuerte de Roxas a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay AD 00}¡A batirse tocan!
  en: >-
    {:unk08 02 00 06}Battle Roxas again, but be warned--


    he's stronger than before.

    {:chardelay 33 00}Not right now.

    {:chardelay AD 00}I'm ready for a fight!
- id: 21483
  fr: >-
    {:delayandfade 07 B4}


    Merlin pense que Winnie a oublié ses amis

    parce que les Sans-cæur ont volé des pages

    du livre.


    Xion a retrouvé les pages manquantes, et

    est retourné dans le monde de Winnie.
  gr: "{:delayandfade 06 78} \n\nMerlin erklärt, dass Puuh sich wegen\nfehlenden Seiten\
    \ seines Bilderbuchs nicht\nmehr an seine Freunde erinnern kann.\n\nXion sammelt\
    \ die Seiten, die von den\nHerzlosen gestohlen wurden, und\nreist ins Bilderbuchland."
  it: >-
    {:delayandfade 07 78}


    Secondo Merlino, gli Heartless hanno

    rubato delle pagine del libro: ecco

    perché Pooh ha dimenticato i suoi

    amici.


    Xion recupera le pagine e torna

    nel mondo di Pooh.
  sp: "{:delayandfade 08 78} \n\nSegún Merlín, Pooh no recuerda\nnada porque los sincorazón\
    \ han\nrobado algunas páginas de su libro.\n\nXion tiene que apresurarse en\n\
    recuperar una a una las páginas y\nregresar al mundo del simpático osito\nantes\
    \ de que la cosa empeore."
  en: "{:delayandfade 07 B4} \n\nAccording to Merlin, Pooh lost his memory\nbecause\
    \ the Heartless had stolen pages out\nof the book.\n\nDetermined to help his friend,\
    \ Xion collects\nthe pages and dives into Pooh's world."
- id: 21484
  fr: >-
    {:delayandfade 07 B4}


    Lorsque Xion est revenu chez Merlin,

    Cid lui a annoncé qu'ils avaient trouvé

    l'ordinateur d'Ansem.


    Ils allaient enfin recueillir des informations

    au sujet de l'Organisation {XIII}, mais

    également sur Riku, Naminé et le Roi !

    C'est le cæur battant que nos amis ont

    pris le chemin de la salle informatique...
  gr: "{:delayandfade 07 78} \n\nIn Merlins Haus hat Cid Neuigkeiten:\nAnsems Computer\
    \ wurde gefunden!\n\nAuf ihm könnten nicht nur Daten\nüber die Organisation {XIII},\
    \ sondern\nauch über Riku, Naminé und sogar den\nKönig sein!\n\nXion stürmt allen\
    \ voran zum\nComputer-Raum ..."
  it: >-
    {:delayandfade 07 78}


    Poco dopo, Xion torna a casa di Merlino

    e Cid lo informa che hanno trovato il

    computer di Ansem.


    Forse potrebbero usarlo per recuperare

    informazioni sull'Organizzazione {XIII} e

    anche su Riku, Naminé e persino il Re!


    Incapaci di contenere l'agitazione,

    corrono nella stanza del computer...
  sp: "{:delayandfade 0A 78} \n\nXion vuelve a la casa de Merlín y\nrecibe de Cid\
    \ la noticia de que el\nordenador de Ansem ha aparecido\ny que podría contener\
    \ datos sobre\nRiku, Naminé, el rey y la Organización {XIII}.\n\nEntusiasmados\
    \ por el hallazgo,\nXion, Donald y Goofy se apresuran\nhacia la sala del ordenador."
  en: "{:delayandfade 07 B4} \n\nXion returns to Merlin's house and is\ninformed\
    \ by Cid that Ansem's computer has\nbeen found. With it, they may be able to get\n\
    their hands on information regarding not\nonly Organization {XIII}, but Riku,\
    \ Naminé, and\neven the King!\n\nUnable to contain their excitement, they\nrush\
    \ off to the computer room."
- id: 21485
  fr: >-
    {:delayandfade 07 B4}


    Xion et ses amis ont réussi à regagner leur

    monde grâce à Tron, mais leurs problèmes

    étaient loin d'être réglés.
  gr: "{:delayandfade 0A 78} \n\nDank Tron sind die drei Freunde\nwieder in der User-Welt.\n\
    \nDoch es gibt noch viel zu tun!"
  it: >-
    {:delayandfade 07 78}


    Grazie a Tron, Xion e i suoi amici

    riescono a tornare nel loro mondo, ma

    devono ancora risolvere il problema.
  sp: "{:delayandfade 07 B4} \n\nGracias a la inestimable ayuda de Tron,\nXion y\
    \ los suyos logran regresar al mundo\nreal, pero aún queda mucho por hacer."
  en: "{:delayandfade 07 B4} \n\nThanks to Tron, Xion and his friends are\nable to\
    \ return to their world.\n\nHowever, the problem has yet to be solved."
- id: 21487
  fr: >-
    {:delayandfade 07 B4}


    Il y a tout juste un an, Xion et ses amis ont

    vaincu un Simili qui cherchait à s'approprier

    Kingdom Hearts. On l'appelait Ansem,

    le chercheur des ténèbres. Mais il ne

    s'agissait pas de son véritable nom.

    Cet ennemi avait en fait usurpé le nom d'un

    ?autre chercheur.
  gr: "{:delayandfade 0A 78} \n\nVor einem Jahr besiegten Xion und seine Gefährten\n\
    den Herzlosen des finsteren Forschers Ansem,\nder Kingdom Hearts an sich reißen\
    \ wollte.\n\nDoch in Wirklichkeit war er nur ein Betrüger,\nder sich für Ansen\
    \ ausgegeben hatte."
  it: >-
    {:delayandfade 07 78}


    Un anno fa, Xion e i suoi amici

    hanno sconfitto l'Heartless che voleva

    impadronirsi di Kingdom Hearts...

    Ansem, il Cercatore dell'Oscurità.


    Tuttavia, egli non era il vero Ansem.

    Era un falso che usava il nome di Ansem

    per realizzare i suoi obiettivi.
  sp: "{:delayandfade 0A 78} \n\nUn año atrás, Xion y sus amigos\nse enfrentaron\
    \ a un vil sincorazón\nque pretendía hacerse con\nKingdom Hearts: Ansem, el buscador\n\
    de oscuridad.\n\nSin embargo, ahora descubren que\nno es ese su verdadero nombre.\n\
    Aquel sincorazón era un impostor\nque simplemente suplantó tal nombre."
  en: "{:delayandfade 07 B4} \n\nOne year ago, Xion and his friends defeated\nthe\
    \ Heartless that was trying to get his hands on\nKingdom Hearts--Ansem, the Seeker\
    \ of Darkness.\n\nHowever, that wasn't the real Ansem. He was\nnothing but a fake,\
    \ using Ansem's name to do\nhis bidding."
- id: 21490
  fr: >-
    {:delayandfade 07 B4}


    Qu'était-il arrivé aux Sans-cæur du monde

    de Tron ? Comment avaient-ils fait pour

    envahir la Forteresse oubliée ?


    Youfie avait une théorie intéressante

    à ce sujet. Pour elle, c'était l'æuvre

    du MCP.
  gr: "{:delayandfade 0A 78} \n\nYuffie hat eine Erklärung für das\nunerwartete Auftauchen\
    \ Herzloser aus\nTrons Welt.\n\nDer MCP läuft in der Computerwelt\nauf Hochtouren!"
  it: >-
    {:delayandfade 07 78}


    Per quale motivo un Heartless del mondo

    di Tron farebbe una cosa simile?


    Secondo Yuffie, l'MCP ha avviato

    la sua operazione malvagia.
  sp: "{:delayandfade 0A 78} \n\n¿Cómo pueden estar los sincorazón\ndel entorno de\
    \ datos de Tron en\nel mundo real?\n\nSegún Yuffie, el PCM está moviendo\nlos\
    \ hilos de su malvado plan desde\nel mundo de los ordenadores."
  en: "{:delayandfade 07 B4} \n\nWhy on earth would the Heartless from\nTron's world\
    \ be here? Xion and his friends\ncan hardly contain their surprise.\n\nAccording\
    \ to Yuffie, it's all due to the\nlaunch of the MCP's evil operation."
- id: 21492
  fr: >-
    {:delayandfade 07 B4}


    Il fallait également retrouver Tron...

    Aerith et les autres s'occuperaient

    du monde extérieur, pendant que

    Xion et ses amis retourneraient

    dans le monde de l'ordinateur.
  gr: "{:delayandfade 0A 78} \n\nUm mit Tron zu kommunizieren,\nmuss Xion selbst\
    \ zurück in die\nComputerwelt.\n\nEr überlässt die Außenwelt Aerith\nund den anderen\
    \ und macht sich\nauf den Weg."
  it: >-
    {:delayandfade 07 78}


    Rimane solo una cosa da fare:

    andare da Tron.


    Xion lascia il destino del mondo

    esterno nelle mani di Aerith e

    i suoi amici e torna nel mondo

    del computer.
  sp: "{:delayandfade 08 78} \n\nAsí las cosas, no queda sino ir\nal mundo de Tron\
    \ y hablar con él\ndirectamente.\n\nMientras Aerith y los demás se\nencargan de\
    \ las cosas en el mundo\nde los usuarios, Xion debe entrar\nde nuevo en el entorno\
    \ de datos."
  en: "{:delayandfade 07 B4} \n\nNow that they've got that figured out,\nthere's only\
    \ one thing to do!\n\nLeaving the fate of the outside world in\nthe hands of Aerith\
    \ and her friends, Xion\nheads back into the computer to see Tron."
- id: 21493
  fr: >-
    {:delayandfade 07 B4}


    En apprenant ce qu'avait dit Séphiroth,

    Cloud a fermé les yeux et hoché la tête

    doucement.


    "L'heure est venue d'en finir..."
  gr: "{:delayandfade 0A 78} \n\nAls Cloud die Worte Sephiroths hört,\nsenkt er den\
    \ Blick und nickt bedächtig.\n\n’Der Moment der Entscheidung\nist gekommen ...\""
  it: >-
    {:delayandfade 07 78}


    Dopo aver ascoltato le parole di

    Sephiroth, Cloud abbassa lo sguardo

    e annuisce.


    "Immagino che sia tempo di

    risolvere la questione."
  sp: "{:delayandfade 0A 78} \n\nNada más compartir con Cloud\nlas palabras de Sephiroth,\
    \ el joven\nagacha la cabeza y reflexiona...\n\n\"Pues es hora de que terminemos\n\
    con esto\", sentencia."
  en: "{:delayandfade 07 B4} \n\nAs promised, Xion and his friends relay\nSephiroth's\
    \ message. As Cloud's gaze\nfalls to the ground, with a single nod,\nhe utters:\n\
    \n\"So I guess it's time we settled this.\""
- id: 21761
  fr: >-
    {:unk08 02 00 06}Combattre Séphiroth à nouveau ?


    {:chardelay 33 00}Pas maintenant.

    {:chardelay 00 13}Je suis prêt à me battre !
  gr: >-
    {:unk08 02 00 06}Möchtest du dich mit Sephiroths messen?


    {:chardelay 33 00}Das lass ich lieber.

    {:chardelay 00 13}Au ja! Auf in den Kampf!
  it: >-
    {:unk08 02 00 06}Combatti di nuovo con Sephiroth?


    {:chardelay 33 00}Non ora.

    {:chardelay 00 13}Non mi fa paura!
  sp: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a Sephiroth?


    {:chardelay 33 00}Ahora no.

    {:chardelay 00 13}¡A batirse tocan!
  en: >-
    {:unk08 02 00 06}Battle Sephiroth again?


    {:chardelay 33 00}Not right now.

    {:chardelay 00 13}I'm ready for a fight!
