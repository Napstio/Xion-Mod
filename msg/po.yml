- id: 21522
  fr: "{:delayandfade 07 B4} \n\nTigrou croit savoir ce qui serait plus\nefficace\
    \ qu'un remède miracle ou du\nmiel pour soigner Winnie. C'est simple,\nil faudrait\
    \ que tout le monde bondisse\nau même moment !\n\nPuisque ça ne coûte rien d'essayer,\n\
    Xion et ses amis ont décidé de sauter\ntous ensemble."
  gr: "{:delayandfade 0A 78} \n\nTigger denkt, dass etwas Hüpfen Puuhs\nGedächtnis\
    \ auf die Sprünge helfen könnte!\n\nEinen Versuch ist es allemal wert."
  it: "{:delayandfade 07 78} \n\nTigro è convinto che Pooh recupererà\nla sua memoria\
    \ se tutti si metteranno\na saltare. Xion e i suoi amici decidono\ndi provarci."
  sp: "{:delayandfade 0A 78} \n\nTigger está convencido de que\nPooh recuperará la\
    \ memoria si\ntodos se ponen a brincar con\nalegría.\n\nA Xion, Donald y Goofy\
    \ les\nparece una buena idea y,\nsin dudarlo, se apuntan al\nfestival de brincos."
  en: "{:delayandfade 07 B4} \n\nTigger claims he knows just the thing to\njog Pooh's\
    \ memory. What's better than a\nbottle of medicine or a trove of honey?\nWhy,\
    \ tiggeriffic bouncing, of course!\n\nHoping for the best, Xion and his friends\n\
    all decide to give it a try."
- id: 21524
  fr: "{:delayandfade 07 B4} \n\nXion est arrivé sur la Butte aux étoiles,\noù il\
    \ a trouvé Winnie la tête coincée\ndans un pot de miel.\n\nAprès un instant d'hésitation,\
    \ il a décidé\nde prêter main-forte à l'ourson."
  gr: "{:delayandfade 0A 78} \n\nXion findet Puuh auf dem Hügel unterm\nSternenhimmel.\
    \ Doch der Tollpatsch steckt\nmit seinem Kopf im Honigtopf fest!\n\nVorsichtig\
    \ hilft Xion ihm aus seinem\nsüßen Dilemma."
  it: "{:delayandfade 07 78} \n\nXion sale sulla collina sotto un cielo\nstellato\
    \ e vede Pooh con la testa\nincastrata in un vasetto di miele.\nChe orsetto sbadato!\n\
    \nDopo un'attenta analisi della situazione,\nXion decide di dare una mano a Pooh."
  sp: "{:delayandfade 08 78} \n\nAl llegar a la Colina de las estrellas,\nXion se\
    \ encuentra a Pooh con\nla cabecita atascada en un gran\ntarro de miel.\n\nAunque\
    \ al principio Xion no está\nmuy seguro de si debería intervenir,\nacaba por\
    \ echar una mano al apurado\nPooh."
  en: "{:delayandfade 07 B4} \n\nAtop the hill with the starry sky, Xion\nfinds Pooh\
    \ with his head stuck in a honey\npot. Silly old bear!\n\nAlthough Xion's not\
    \ quite sure whether to\nhelp him or leave him be, after some\npondering, he decides\
    \ to give Pooh a hand."
